<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="55%" stop-color="#0d0b1c"/>
      <stop offset="100%" stop-color="#05050b"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="75%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#8b5cf6"
            stroke-opacity="0.08"
            stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Developer grid -->
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="920" cy="120" r="130"
          fill="#7c3aed"
          fill-opacity="0.06"/>

  <circle cx="1050" cy="230" r="100"
          fill="#22d3ee"
          fill-opacity="0.045"/>

  <!-- Decorative circuit lines -->
  <g fill="none" stroke="url(#line)" stroke-width="2" opacity="0.8">

    <path d="M0 225 H180 L215 190 H360"/>
    <path d="M840 55 H970 L1000 85 H1200"/>
    <path d="M760 250 H900 L930 220 H1200"/>

  </g>

  <!-- Circuit nodes -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle cx="180" cy="225" r="3"/>
    <circle cx="360" cy="190" r="3"/>
    <circle cx="970" cy="55" r="3"/>
    <circle cx="1000" cy="85" r="3"/>
    <circle cx="900" cy="250" r="3"/>
  </g>

  <!-- Main accent line -->
  <rect x="70" y="215" width="520" height="2"
        fill="url(#line)"
        filter="url(#glow)"/>

  <!-- Small system text -->
  <g font-family="monospace" fill="#94a3b8">

    <text x="72" y="75" font-size="12">
      SYSTEM / BUILDER_WORKSPACE
    </text>

    <text x="72" y="98" font-size="10" opacity="0.65">
      mobile • fullstack • backend • experimentation
    </text>

    <text x="72" y="250" font-size="10" opacity="0.55">
      STATUS :: BUILDING
    </text>

  </g>

  <!-- Main identity -->
  <text x="70" y="165"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        letter-spacing="4"
        fill="#f8fafc">
    PARAMESHWARAN P
  </text>

  <!-- Accent subtitle -->
  <text x="74" y="195"
        font-family="monospace"
        font-size="14"
        letter-spacing="3"
        fill="#a78bfa">
    BUILD • EXPERIMENT • LEARN • SHIP
  </text>

  <!-- Right-side cyber decoration -->
  <g opacity="0.65">

    <rect x="1000" y="125" width="100" height="55"
          rx="4"
          fill="none"
          stroke="#7c3aed"
          stroke-opacity="0.45"/>

    <rect x="1015" y="140" width="70" height="4"
          fill="#22d3ee"
          fill-opacity="0.5"/>

    <rect x="1015" y="152" width="48" height="4"
          fill="#7c3aed"
          fill-opacity="0.5"/>

    <rect x="1015" y="164" width="60" height="4"
          fill="#ec4899"
          fill-opacity="0.35"/>

  </g>

  <!-- Corner markers -->
  <g stroke="#a78bfa" stroke-width="2" opacity="0.6">

    <path d="M30 30 H70"/>
    <path d="M30 30 V70"/>

    <path d="M1130 270 H1170"/>
    <path d="M1170 230 V270"/>

  </g>

</svg>
